<!DOCTYPE html>
<html>
<head>
  <title>Journey Logger</title>
</head>

<body style="font-family: Arial; padding: 20px;">

<h2>Journey Entry Logger</h2>
<p>Configured automatically.</p>

<script src="https://jbinteractions-cdn.s3.amazonaws.com/interaction/v1/interaction.js"></script>

<script>
var connection = new Postmonger.Session();
var payload = {};

connection.on("initActivity", function(data){
    console.log("INIT", data);

    payload = data || {};
    payload.metaData = payload.metaData || {};
    payload.metaData.isConfigured = true;
    payload.name = "Journey Entry Logger";

    connection.trigger("updateActivity", payload);
});

connection.trigger("ready");

</script>

</body>
</html>
